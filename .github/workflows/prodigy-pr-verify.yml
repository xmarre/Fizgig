name: Prodigy PR verification

on:
  push:
    branches:
      - feature/minimax-prodigy-plus

permissions:
  contents: read

jobs:
  cpu-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.10.0
          python -m pip install "numpy>=1.26.4,<3" safetensors==0.5.3 prodigy-plus-schedule-free==2.0.1
      - name: Compile Python sources
        run: python -m compileall -q src/fizgig lora_trainer_gui.py tests/test_prodigy_plus.py
      - name: Run Prodigy regression coverage
        run: python tests/test_prodigy_plus.py
